[package]
name = "xs-rust-library"
version = "0.1.0"
edition = "2024"
authors = ["xsware.at"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
parking_lot = "0.12"
thiserror = "2.0"
displaydoc = "0.2"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
aes-gcm = { version = "0.11.0" }
rand = "*"

[dev-dependencies]
bytesize = "*"
fastrand = "*"

[lib]
doctest = false
